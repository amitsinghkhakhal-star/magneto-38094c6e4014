# seed
name: spider
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  spider:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'spider-run')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        n: [1,2,3,4,5,6,7,8]
    steps:
    - uses: actions/checkout@v4
    - name: run
      run: |
        chmod +x ./spider
        sudo ./spider 0.0.0.0 1 1 350
